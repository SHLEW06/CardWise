<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CardWise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><h1>CardWise</h1><span id="version"></span></header>
    <p id="link" role="status"></p>
    <h2>Banks</h2>
    <ul id="banks" aria-label="Banks"></ul>
    <label class="switch"><input type="checkbox" id="autoAdd"> Auto-add the offers you chose in CardWise when you open a bank's offers page</label>
    <h2>What the extension does</h2>
    <ul id="claims" class="claims"></ul>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
